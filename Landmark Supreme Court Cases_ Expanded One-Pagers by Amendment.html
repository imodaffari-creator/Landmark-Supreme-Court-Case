om to marry a person of a different race, recognized as a fundamental right.", "l": "State laws banning or criminalizing interracial marriage, then still on the books in over a dozen states.", "lg": "Struck down the last of America's anti-miscegenation laws nationwide, and its reasoning — that marriage is a fundamental right protected from arbitrary state interference — was directly invoked decades later by the Court in Obergefell v. Hodges to extend marriage rights to same-sex couples.", "kt": [["Anti-miscegenation law", "A law banning marriage or sex between people of different races."], ["Fundamental right", "A right, like marriage, considered so basic that laws burdening it receive the Court's strictest scrutiny."], ["Strict scrutiny (racial classifications)", "The demanding standard applied to any law classifying people by race."], ["Invidious discrimination", "Discrimination based on animus or prejudice, serving no legitimate government purpose."]]}, {"n": "Reed v. Reed", "m": "1971 · 7–0 · Burger", "tag": "14th Amend. EP", "f": "When Richard Reed, a minor, died without a will, both his adoptive mother Sally Reed and his father Cecil Reed sought to be appointed administrator of his small estate. Idaho law provided that as between individuals otherwise equally entitled, 'males must be preferred to females' automatically, without regard to either parent's actual qualifications; the probate court appointed Cecil Reed solely because he was male.", "cl": "Equal Protection Clause of the 14th Amendment.", "r": "The Court unanimously held that the mandatory male preference was an arbitrary legislative choice unrelated to any legitimate state objective, and struck down the law as sex discrimination violating equal protection.", "p": "Equal treatment of men and women under the law.", "l": "Automatic, blanket sex-based classifications lacking any rational justification tied to actual qualifications.", "lg": "The first time the Supreme Court ever struck down a law specifically because it discriminated on the basis of sex, opening the door to the modern body of sex-discrimination law; the case was argued by a young ACLU lawyer named Ruth Bader Ginsburg, who would go on to lead much of that later litigation.", "kt": [["Sex-based classification", "A law that treats people differently based on their sex."], ["Rational basis review (as first applied here)", "A relatively lenient standard, which the law nonetheless failed because the sex preference was purely arbitrary."], ["Intermediate scrutiny (later development)", "A heightened standard for sex classifications the Court would formally adopt a few years later in Craig v. Boren."], ["Probate administrator", "The person appointed to manage and distribute a deceased person's estate."]]}, {"n": "Roe v. Wade", "m": "1973 · 7–2 · Blackmun", "tag": "14th Amend. DP", "f": "'Jane Roe,' the pseudonym for Norma McCorvey, challenged a Texas law that criminalized abortion except when necessary to save the mother's life. Roe, an unmarried pregnant woman, argued the law violated her constitutional rights by denying her the ability to terminate her pregnancy, framing the claim around a right to privacy the Court had recognized in earlier cases like Griswold v. Connecticut.", "cl": "Due Process Clause of the 14th Amendment, interpreted to encompass an implied right to privacy.", "r": "The Court held 7–2 that the constitutional right to privacy is broad enough to include a woman's qualified right to choose to have an abortion, and it adopted a trimester framework balancing that right against the state's growing interests in maternal health and potential life as pregnancy progressed.", "p": "Abortion access, recognized as a constitutional right subject to state regulation increasing over the course of pregnancy.", "l": "State authority to ban abortion outright, particularly before fetal viability.", "lg": "One of the most contested rulings in American history, fueling decades of political and legal conflict; its trimester framework was replaced by an 'undue burden' standard in Planned Parenthood v. Casey (1992), and the underlying constitutional right to abortion itself was overruled entirely by Dobbs v. Jackson Women's Health Organization (2022).", "kt": [["Right to privacy", "An implied, unenumerated constitutional right the Court found rooted in the 14th Amendment's liberty guarantee."], ["Trimester framework", "Roe's original structure balancing abortion rights against state interests differently in each trimester of pregnancy."], ["Viability", "The point at which a fetus could potentially survive outside the womb, a key line in abortion jurisprudence."], ["Unenumerated right", "A right not explicitly listed in the Constitution's text but recognized as implicit in its guarantees of liberty."]]}, {"n": "Morton v. Mancari", "m": "1974 · 9–0 · Blackmun", "tag": "5th Amend.", "f": "The federal Bureau of Indian Affairs (BIA) maintained a longstanding hiring preference giving qualified Native Americans priority for jobs within the agency. Non-Native BIA employees who were passed over for promotions sued, arguing the preference amounted to unconstitutional racial discrimination against them in federal employment.", "cl": "Equal protection component implicit in the 5th Amendment's Due Process Clause (binding the federal government); federal trust responsibility toward tribal nations.", "r": "The Court unanimously upheld the preference, holding it was not a racial classification at all but a political one, tied to the unique legal and historical relationship between the federal government and sovereign tribal nations, and that such preferences are valid so long as they are rationally tied to Congress's fulfillment of its trust obligations.", "p": "Tribal self-governance and Native American hiring preferences within agencies serving tribal interests.", "l": "Equal-protection-style challenges to tribal preferences that are genuinely tied to the federal-tribal political relationship, not race.", "lg": "Established the enduring legal principle that political classifications based on tribal affiliation are different from racial classifications, a distinction that remains central to modern federal Indian law and later cases involving tribal sovereignty and federal Indian programs.", "kt": [["Political classification (vs. racial)", "The key legal distinction the Court drew, treating tribal-affiliation preferences differently than race-based ones."], ["Trust responsibility", "The federal government's unique, longstanding legal and fiduciary obligations toward Native American tribes."], ["Tribal sovereignty", "Native American tribes' inherent authority to govern themselves, a concept underlying the federal-tribal relationship."], ["Rational basis (as applied to tribal preferences)", "The relatively deferential standard applied here because the classification was political, not racial."]]}, {"n": "Regents of the University of California v. Bakke", "m": "1978 · 5–4 · Powell (fractured)", "tag": "14th Amend. EP", "f": "UC Davis Medical School operated a special admissions program that set aside 16 of its 100 seats each year specifically for minority applicants, evaluated through a separate process. Allan Bakke, a white applicant with test scores and grades higher than many admitted minority applicants, was rejected twice and sued, arguing the rigid quota system violated equal protection and Title VI of the Civil Rights Act.", "cl": "Equal Protection Clause of the 14th Amendment; Title VI of the Civil Rights Act of 1964.", "r": "In a deeply fractured decision with no single majority opinion, the Court struck down the rigid numerical quota as unconstitutional and ordered Bakke admitted, but Justice Powell's controlling opinion held that achieving a diverse student body is a compelling interest and that race may still be considered as one factor among many in an individualized admissions process.", "p": "Diversity in higher education as a legally compelling interest justifying some consideration of race.", "l": "Rigid racial quotas or fixed set-asides of admissions slots by race.", "lg": "Set the framework governing race-conscious college admissions for the next 45 years — race as one flexible factor, not a quota — until that framework was itself effectively overruled by Students for Fair Admissions v. Harvard/UNC in 2023.", "kt": [["Quota system", "A rigid numerical set-aside of positions (here, admissions seats) for a particular group, struck down here."], ["Compelling interest", "The strongest level of government justification, required under strict scrutiny for racial classifications."], ["Holistic/individualized review", "Considering race as one factor among many for each applicant, rather than through a quota."], ["Fractured/plurality decision", "A ruling where no single opinion commands a full majority, making Justice Powell's opinion the practical controlling rule."]]}, {"n": "Adarand Constructors, Inc. v. Peña", "m": "1995 · 5–4 · O'Connor", "tag": "5th Amend. EP", "f": "A federal highway construction contract included a financial incentive for the general contractor to hire subcontractors owned by 'socially and economically disadvantaged individuals,' a category that, by federal regulation, was presumed to include members of certain racial minority groups. Adarand Constructors, a white-owned guardrail company, submitted the lowest bid for a subcontract but lost it to a minority-owned firm receiving the incentive, and sued.", "cl": "Equal protection component of the 5th Amendment's Due Process Clause, applying to federal (not just state) race-conscious programs.", "r": "The Court held 5–4 that all racial classifications imposed by any level of government — federal, state, or local — must be analyzed under strict scrutiny, overruling a prior, more lenient standard the Court had applied to federal affirmative action programs. The case was remanded for the program to be reviewed under this stricter standard.", "p": "Individuals' right to equal treatment regardless of race, even under federal contracting programs.", "l": "Federal race-conscious affirmative action programs, which now had to satisfy the same demanding strict scrutiny as state and local programs.", "lg": "Unified the constitutional standard for reviewing racial classifications across all levels of government, requiring even well-intentioned federal affirmative action programs to be narrowly tailored to a compelling interest, significantly reshaping federal contracting and benefits programs.", "kt": [["Strict scrutiny (uniform standard)", "The demanding review the Court held must apply equally to federal, state, and local racial classifications after this case."], ["Affirmative action", "Programs intended to increase opportunities for historically disadvantaged groups, often through race-conscious measures."], ["Remand", "Sending a case back to a lower court for further proceedings consistent with the higher court's ruling."], ["Narrow tailoring", "The requirement that a race-conscious program be closely fitted to achieving its compelling interest, not broader than necessary."]]}, {"n": "United States v. Virginia (VMI)", "m": "1996 · 7–1 · Ginsburg", "tag": "14th Amend. EP", "f": "The Virginia Military Institute (VMI), a prestigious state-run military college known for its rigorous 'adversative' training method, had for over 150 years admitted only male cadets. The United States sued on behalf of women who wished to attend, and Virginia's proposed remedy was a separate, much smaller leadership program for women at a nearby private women's college, lacking VMI's military structure, faculty, facilities, and alumni network.", "cl": "Equal Protection Clause of the 14th Amendment; sex-based classifications require an 'exceedingly persuasive justification.'", "r": "The Court held 7–1 that VMI's male-only admissions policy was unconstitutional and that the proposed separate women's program was not remotely equal in substance, faculty, resources, or prestige. VMI was ordered to admit qualified women.", "p": "Equal access to public educational opportunities regardless of sex, even in historically male-dominated institutions.", "l": "State-run schools' ability to categorically exclude women or to offer them only a separate, unequal substitute program.", "lg": "Solidified the 'exceedingly persuasive justification' standard for sex-based classifications and stands as one of Justice Ginsburg's signature opinions, capping decades of her earlier litigation work challenging sex discrimination.", "kt": [["Exceedingly persuasive justification", "The heightened standard the government must meet to justify a sex-based classification."], ["Intermediate scrutiny", "The general standard (between rational basis and strict scrutiny) applied to sex discrimination claims."], ["Adversative method", "VMI's intense, physically and mentally demanding training model, central to the school's identity."], ["Separate-but-unequal remedy", "A proposed alternative program the Court found failed to actually provide equal opportunity."]]}, {"n": "Bush v. Gore", "m": "2000 · 5–4 (7–2 on the EP issue) · per curiam", "tag": "14th Amend. EP", "f": "The 2000 presidential election came down to an extraordinarily close vote count in Florida. After an initial machine count and mandatory recount left the outcome within the legal margin triggering further review, the Florida Supreme Court ordered a statewide manual recount of disputed ballots, but without establishing a single uniform standard for how election officials in different counties should judge ambiguous or contested ballots (like 'hanging chads').", "cl": "Equal Protection Clause of the 14th Amendment.", "r": "The Court held that conducting a recount without uniform, specific standards for evaluating ballots violated equal protection, since voters' ballots could be judged differently depending on which county counted them. It further held that no constitutionally adequate recount could be completed by the safe-harbor deadline, effectively ending the recount and settling the election.", "p": "Equal treatment of voters' ballots under a single, uniform counting standard.", "l": "Recount procedures conducted without consistent statewide standards for evaluating disputed ballots.", "lg": "One of the most consequential and controversial rulings in modern history, effectively deciding the outcome of the 2000 presidential election; the majority itself took the unusual step of stating the ruling was 'limited to the present circumstances,' and it has rarely been cited as broad precedent since.", "kt": [["Recount", "A repeated, often manual, count of ballots to verify or contest an initial election result."], ["Safe harbor deadline", "A federal statutory deadline by which states' electoral vote determinations are treated as conclusive."], ["Uniform standard requirement", "The equal protection principle, applied here, that ballots must be evaluated by consistent criteria."], ["Limited to the present circumstances", "The unusual disclaimer in the opinion suggesting it was not meant to set broad, lasting precedent."]]}, {"n": "Henkle v. Gregory", "m": "2001 · D. Nev. (federal district court)", "tag": "14th Amend. EP", "f": "Derek Henkle, a gay student in the Washoe County, Nevada school district, endured years of severe harassment, threats, and physical assault by classmates because of his sexual orientation across multiple schools. He alleged that school administrators knew about the abuse, failed to meaningfully intervene, and in some instances blamed him or suggested he should simply hide his sexual orientation to avoid further attacks.", "cl": "Equal Protection Clause of the 14th Amendment, applied to school officials' failure to protect a student from peer harassment.", "r": "The federal district court denied the school district's motion to dismiss, allowing Henkle's claims to proceed on the theory that officials' deliberate indifference to known anti-gay harassment of a student could itself amount to an equal protection violation. The case subsequently settled, with the district agreeing to a substantial payment and policy changes.", "p": "Students' right to be protected from severe, officially tolerated harassment based on sexual orientation.", "l": "School officials' ability to ignore or dismiss known, serious harassment of LGBTQ students without legal consequence.", "lg": "A lower-court ruling (not a Supreme Court decision) that became an influential early precedent in LGBTQ student-rights litigation, encouraging school districts nationwide to adopt stronger anti-bullying and anti-harassment policies specifically covering sexual orientation.", "kt": [["Deliberate indifference", "A legal standard describing officials' knowing failure to act on a known, serious risk of harm."], ["Motion to dismiss", "A request asking a court to throw out a case before trial for legal insufficiency; denying it lets the case proceed."], ["Peer harassment liability", "The theory that school officials can be held legally responsible for failing to address known student-on-student harassment."], ["Settlement", "A negotiated resolution of a lawsuit reached without a final court judgment, as occurred here."]]}, {"n": "Grutter v. Bollinger", "m": "2003 · 5–4 · O'Connor", "tag": "14th Amend. EP", "f": "Barbara Grutter, a white Michigan resident with a strong academic record, was denied admission to the University of Michigan Law School, which used a holistic admissions process that considered race as one of many factors intended to achieve a 'critical mass' of underrepresented minority students for the educational benefits of diversity. Grutter sued, arguing the practice was unconstitutional racial discrimination.", "cl": "Equal Protection Clause of the 14th Amendment; strict scrutiny for racial classifications.", "r": "The Court held 5–4 that obtaining the educational benefits of a diverse student body is a compelling state interest, and that the law school's flexible, holistic, individualized consideration of race as one factor among many — not a quota — was narrowly tailored enough to survive strict scrutiny.", "p": "Universities' ability to consider race as one factor in a holistic admissions process to achieve educational diversity.", "l": "Rigid racial quotas, mechanical point systems, or admissions processes that make race the defining or decisive factor for individual applicants.", "lg": "Reaffirmed and refined Bakke's framework for two decades, and O'Connor's opinion famously expressed hope that race-conscious admissions would no longer be necessary in 25 years; the framework was effectively ended sooner, in 2023, by Students for Fair Admissions v. Harvard.", "kt": [["Critical mass", "A sufficient number of minority students to provide the educational benefits of diversity, without functioning as a quota."], ["Holistic review", "Admissions review considering the whole applicant, with race as one factor among many, not decisive alone."], ["Compelling interest (diversity)", "The educational benefits of a diverse student body, recognized here as sufficient to justify limited race-conscious admissions."], ["Narrow tailoring", "The requirement that race-conscious policies be carefully limited to achieving the compelling interest, not broader than necessary."]]}, {"n": "Lawrence v. Texas", "m": "2003 · 6–3 · Kennedy", "tag": "14th Amend. DP", "f": "Houston police, responding to a false report of a weapons disturbance, entered John Lawrence's apartment and found him and Tyron Garner engaged in private, consensual sexual activity. Both men were arrested and convicted under a Texas statute that specifically criminalized 'deviate sexual intercourse' between people of the same sex, though similar conduct between opposite-sex partners was legal.", "cl": "Due Process Clause of the 14th Amendment, protecting liberty interests including personal and intimate decision-making.", "r": "The Court held 6–3 that the Texas law violated due process because adults have a constitutionally protected liberty interest in engaging in private, consensual intimate conduct without unwarranted government intrusion, and it explicitly overruled its own 1986 decision in Bowers v. Hardwick, which had upheld a similar Georgia sodomy law.", "p": "Private, consensual intimate conduct between adults, including same-sex couples.", "l": "State criminalization of private, consensual sexual conduct between adults of the same sex.", "lg": "Invalidated remaining sodomy laws nationwide and is regarded as a foundational precedent for the modern LGBTQ rights movement in the courts, with its liberty-based reasoning cited directly by the Court a dozen years later in Obergefell v. Hodges.", "kt": [["Sodomy law", "A statute criminalizing certain sexual acts, historically enforced disproportionately against same-sex couples."], ["Liberty interest", "A protected personal freedom under the Due Process Clause, here extended to private intimate conduct."], ["Overruling Bowers v. Hardwick", "The explicit reversal of the Court's own 1986 precedent that had upheld similar sodomy laws."], ["Substantive due process", "The doctrine protecting certain fundamental rights from government interference, even without explicit textual listing."]]}, {"n": "Obergefell v. Hodges", "m": "2015 · 5–4 · Kennedy", "tag": "14th Amend. EP + DP", "f": "Same-sex couples from Ohio, Michigan, Kentucky, and Tennessee, including Jim Obergefell, who had married his terminally ill partner John Arthur in Maryland only to have Ohio refuse to list him as a surviving spouse on the death certificate, sued to challenge their states' bans on same-sex marriage and refusal to recognize such marriages performed elsewhere.", "cl": "Due Process and Equal Protection Clauses of the 14th Amendment.", "r": "The Court held 5–4 that the right to marry is a fundamental right guaranteed to same-sex couples by both the Due Process and Equal Protection Clauses, and that states must license same-sex marriages and recognize those lawfully performed in other states.", "p": "Same-sex couples' freedom to marry and to have their marriages recognized nationwide.", "l": "State laws and constitutional amendments banning same-sex marriage or refusing to recognize same-sex marriages from other states.", "lg": "Legalized same-sex marriage across the entire United States in one ruling, marking the culmination of a decades-long legal and social movement, and remains a landmark expansion of marriage equality, though its continued vitality has periodically been debated in the context of later personal-liberty rulings.", "kt": [["Fundamental right to marry", "A liberty interest the Court held extends equally to same-sex couples."], ["Full faith and credit (related concept)", "The broader constitutional principle requiring states to generally recognize other states' legal acts, relevant to marriage recognition."], ["Dignity (as a constitutional value)", "A theme in Kennedy's opinion, framing marriage rights as connected to equal dignity for same-sex couples."], ["Windsor v. United States (predecessor)", "The 2013 case striking down the federal Defense of Marriage Act's refusal to recognize same-sex marriages, a key precursor to Obergefell."]]}, {"n": "Dobbs v. Jackson Women's Health Organization", "m": "2022 · 6–3 (5–4 on overruling) · Alito", "tag": "14th Amend. DP", "f": "Mississippi passed the Gestational Age Act, banning most abortions after 15 weeks of pregnancy, well before the point of fetal viability that Roe and Casey had protected. Jackson Women's Health Organization, the state's only licensed abortion clinic, sued to block the law, and the case reached the Supreme Court squarely presenting the question of whether Roe and Casey should be reconsidered.", "cl": "Due Process Clause of the 14th Amendment: whether the Constitution's protection of 'liberty' includes a right to abortion, examined through whether that right is 'deeply rooted in this Nation's history and tradition.'", "r": "The Court held 6–3 that the Constitution does not confer a right to abortion, because such a right is not deeply rooted in the nation's history and tradition, and explicitly overruled both Roe v. Wade and Planned Parenthood v. Casey. Authority to regulate or ban abortion returned entirely to the states, evaluated under ordinary rational basis review.", "p": "State authority to regulate, restrict, or ban abortion as each state's legislature sees fit.", "l": "The federal constitutional right to abortion previously recognized under Roe and Casey, which no longer exists.", "lg": "One of the most significant reversals of precedent in modern Supreme Court history, immediately triggering a wave of state abortion bans and restrictions (as well as state constitutional protections in other states), and reshaping American abortion law and politics on a state-by-state basis.", "kt": [["History-and-tradition test", "The methodology Dobbs used, asking whether a claimed right is deeply rooted in the nation's history, rather than relying on precedent like Roe's privacy framework."], ["Stare decisis", "The principle of respecting prior court precedent, which the majority concluded did not require preserving Roe and Casey."], ["Undue burden standard", "The Casey-era test for evaluating abortion restrictions, which Dobbs eliminated along with Roe."], ["Rational basis review", "The most deferential level of judicial review, which now applies to abortion regulations after Dobbs."]]}]}];
